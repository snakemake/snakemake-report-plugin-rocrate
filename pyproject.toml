[project]
name = "snakemake-report-plugin-rocrate"
version = "0.1.0"
authors = [
    { name = "Felix Bartusch", email = "felix.bartusch@uni-tuebingen.de" },
]
description = "Snakemake Report Plugin to automatically create Workflow Run RO-Crates"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "snakemake-interface-common (>=1.17.4,<2.0.0)", 
    "snakemake-interface-report-plugins (>=1.1.0,<2.0.0)",
    "rocrate (>=0.15.0, <2.0.0)",
    "spdx-license-list (>=3.28.0, <4.0.0)"
]

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling",]

[dependency-groups]
dev = [ "mypy", "types-requests", "ruff", "coverage", "pytest", "twine", "build", "snakemake>=9.17.2,<10",]

[project.urls]
Repository = "https://github.com/your/plugin"
Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/report/rocrate.html"

[tool.pixi.workspace]
channels = [ "conda-forge",]
platforms = [ "linux-64",]

[tool.pixi.tasks]

[tool.pixi.pypi-dependencies.snakemake_report_plugin_rocrate]
path = "."
editable = true

[tool.pixi.environments.dev]
features = [ "dev",]

[tool.ruff.lint]
select = [
    "E",
    "W", 
    "F",
    "I",    # isort — import sorting
    "ANN",
    "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "rocrate.*",
    "snakemake.*",
    "snakemake_interface_report_plugins.*",
    "snakemake_interface_common.*",
]
ignore_missing_imports = true

[tool.pixi.feature.dev.tasks]
lint = "ruff check"
format = "ruff format"
typecheck = "mypy src/"
test = "pytest --cov=snakemake-report-plugin-rocrate --cov-report=xml:coverage-report/coverage.xml --cov-report=term-missing tests/tests.py"
build = "python -m build"
check-build = { cmd = "python -m twine check dist/*", depends-on = ["build"] }
