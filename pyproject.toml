[project]
name = "snakemake-report-plugin-rocrate"
version = "0.1.0"
authors = [
    { name = "Felix Bartusch", email = "felix.bartusch@uni-tuebingen.de" },
    { name = "Mahdi Jafarkhani", email = "mahdi.jafarkhani@tik.uni-stuttgart.de" }
]
description = "Snakemake Report Plugin to automatically create Workflow Run RO-Crates"
urls = { Repository = "https://github.com/snakemake/snakemake-report-plugin-rocrate", Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/report/rocrate.html" }
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "snakemake-interface-common (>=1.17.4,<2.0.0)", 
    "snakemake-interface-report-plugins (>=1.1.0,<2.0.0)",
    "rocrate (>=0.15.0, <2.0.0)",
    "spdx-license-list (>=3.28.0, <4.0.0)",
    "roc-validator",
    "markdown-it-py (>=2.2,<3.0.0)"
]

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling",]

[dependency-groups]
dev = [ "mypy", "ruff", "coverage", "pytest", "pytest-cov", "twine", "build", "snakemake>=9.17.2,<10",]

[tool.pixi.workspace]
channels = [ "conda-forge",]
platforms = [ "linux-64",]

[tool.pixi.tasks]

[tool.pixi.pypi-dependencies.snakemake_report_plugin_rocrate]
path = "."
editable = true

[tool.pixi.feature.dev.dependencies]
pip = "*"
packaging = "<26"  # snakemake>=9.17.2 depends on packaging>=24.0,<26

# Dependencies for the different supported Python versions.
# These are used in CI to test the plugin against all supported Python versions.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# Development Environment
[tool.pixi.environments.dev]
features = [ "dev",]

# Test environments for all supported Python versions.
# These are used in CI to test the plugin against all supported Python versions.
[tool.pixi.environments.test-py311]
features = ["dev", "py311"]
solve-group = "py311"

[tool.pixi.environments.test-py312]
features = ["dev", "py312"]
solve-group = "py312"

[tool.pixi.environments.test-py313]
features = ["dev", "py313"]
solve-group = "py313"

[tool.pixi.environments.test-py314]
features = ["dev", "py314"]
solve-group = "py314"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle: errors
    "W",     # pycodestyle: warnings
    "F",     # Pyflakes: undefined names, unused imports, etc.
    "I",     # isort: import sorting
    "ANN",   # flake8-annotations: missing/incorrect type annotations
    "UP",    # pyupgrade: use modern syntax for the supported Python versions
    "B",     # flake8-bugbear: likely bugs and design problems
    "SIM",   # flake8-simplify: unnecessarily complex constructs
    "RUF",   # ruff-specific rules not covered by the above
    "T20",   # flake8-print: disallow stray print() calls
    "PTH",   # flake8-use-pathlib: prefer pathlib over os.path
    "PT",    # flake8-pytest-style: pytest usage conventions
]

[tool.ruff.lint.per-file-ignores]
# Ignore type annotations for the time beeing.
"src/snakemake_report_plugin_rocrate/*.py" = ["ANN"]
"examples/*" = ["ANN", "PTH"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "rocrate.*",
    "snakemake.*",
    "snakemake_interface_report_plugins.*",
    "snakemake_interface_common.*",
    "snakemake.common.tests.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "snakemake_report_plugin_rocrate.jsonld",
    "snakemake_report_plugin_rocrate.models",
    "snakemake_report_plugin_rocrate.provenance",
    "snakemake_report_plugin_rocrate.provenance_files",
    "snakemake_report_plugin_rocrate.provenance_graph",
    "snakemake_report_plugin_rocrate.provenance_jobs",
    "snakemake_report_plugin_rocrate.rocrate_builder",
    "snakemake_report_plugin_rocrate.tool_resolver",
    "snakemake_report_plugin_rocrate.utils",
    "snakemake_report_plugin_rocrate.validator",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pixi.feature.dev.tasks]
lint = "ruff check"
format-check = "ruff format --check"
format = "ruff format"
typecheck = "mypy src/"
test = "pytest --cov=snakemake_report_plugin_rocrate --cov-report=xml:coverage-report/coverage.xml --cov-report=term-missing tests/"

# Faster subset of CI pipeline
check = { depends-on = ["format-check", "lint", "typecheck", "test"] }

# This resembles the basic CI pipeline. Run
#   pixi run -e dev ci
# before pushing to main.
ci = "bash scripts/ci-local.sh"

build = "python -m build"
check-build = { cmd = "python -m twine check dist/*", depends-on = ["build"]}
verify-install = "python -m pip install --no-deps --force-reinstall dist/*.whl && python -c 'import snakemake_report_plugin_rocrate'"